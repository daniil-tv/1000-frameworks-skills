name: Collect Wordstat semantics

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: Page ID from seo/pages.json
        required: true
        default: odi
        type: string
      region:
        description: Wordstat region ID (225 = Russia; blank = all regions)
        required: false
        default: "225"
        type: string
      seeds:
        description: Optional override; one "- phrase" per line
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: wordstat-semantics
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == github.repository_owner &&
       startsWith(github.event.issue.title, '[semantics] '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PAGE_ID: ${{ inputs.page_id }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_SEEDS: ${{ inputs.seeds }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PAGE_ID="$INPUT_PAGE_ID"
            REGION="$INPUT_REGION"
          else
            PAGE_ID="${ISSUE_TITLE#\[semantics\] }"
            REGION="$(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^[[:space:]]*region:[[:space:]]*([0-9]*)[[:space:]]*$/\1/p' | head -n 1)"
            REGION="${REGION:-225}"
          fi
          if ! printf '%s' "$PAGE_ID" | grep -Eq '^[a-z0-9-]+$'; then
            echo "Invalid page ID."
            exit 2
          fi
          if [ -n "$REGION" ] && ! printf '%s' "$REGION" | grep -Eq '^[0-9]+$'; then
            echo "Invalid region ID."
            exit 2
          fi
          REQUEST_FILE="$RUNNER_TEMP/semantics-request.txt"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_SEEDS" ]; then
            {
              printf '%s\n' "seeds:"
              printf '%s\n' "$INPUT_SEEDS"
            } > "$REQUEST_FILE"
          elif [ "$EVENT_NAME" = "issues" ]; then
            printf '%s\n' "$ISSUE_BODY" > "$REQUEST_FILE"
          else
            : > "$REQUEST_FILE"
          fi
          echo "page_id=$PAGE_ID" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
      - name: Check credentials
        env:
          YANDEX_CLOUD_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          if [ -z "$YANDEX_CLOUD_API_KEY" ] || [ -z "$YANDEX_CLOUD_FOLDER_ID" ]; then
            echo "Add YANDEX_CLOUD_API_KEY and YANDEX_CLOUD_FOLDER_ID in repository Actions secrets."
            exit 1
          fi
      - name: Collect and classify queries
        env:
          YANDEX_CLOUD_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_ID }}
          PAGE_ID: ${{ steps.request.outputs.page_id }}
          WORDSTAT_REGION: ${{ steps.request.outputs.region }}
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        run: |
          python seo/collect.py --page "$PAGE_ID" --region "$WORDSTAT_REGION" --request-file "$REQUEST_FILE"
      - name: Commit semantic artifacts
        env:
          PAGE_ID: ${{ steps.request.outputs.page_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/data
          if ! git diff --cached --quiet; then
            git commit -m "seo: update Wordstat semantics for $PAGE_ID"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
            echo "Unable to push semantic artifacts after retries."
            exit 1
          fi
      - name: Report result to GPT request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_ID: ${{ steps.request.outputs.page_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Сбор завершён. Результаты: seo/data/$PAGE_ID/. Запуск: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue close "$ISSUE_NUMBER" --reason completed
